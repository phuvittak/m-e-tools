<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แคตตาล็อกสินค้า — M.E.Tools ท่ารั้ว เชียงใหม่</title>
  <meta name="description" content="ดูแคตตาล็อกเครื่องมือช่าง M.E.Tools ครบทุกรุ่น DEWALT MAKITA BOSCH ท่ารั้ว เชียงใหม่">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .catalog-wrap { display:flex; flex-direction:column; min-height:100vh }
    .catalog-hero {
      background:var(--ink,#0b0b0b); color:#fff; padding:28px 24px 20px;
      text-align:center
    }
    .catalog-hero h1 { margin:0 0 6px; font-size:clamp(20px,4vw,28px) }
    .catalog-hero p { margin:0; color:rgba(255,255,255,.65); font-size:14px }
    .catalog-frame-wrap {
      flex:1; position:relative; background:#222;
      min-height:calc(100vh - 140px)
    }
    .catalog-frame-wrap iframe {
      position:absolute; inset:0; width:100%; height:100%;
      border:none; display:block
    }
    .catalog-loading {
      position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; color:#fff; font-size:15px; gap:10px;
      pointer-events:none
    }
    .catalog-nav {
      background:var(--ink,#0b0b0b); padding:12px 20px;
      display:flex; justify-content:center; gap:16px; flex-wrap:wrap
    }
    .catalog-nav a {
      color:var(--dw-yellow,#FFB81C); font-weight:600; font-size:14px;
      text-decoration:none
    }
    .catalog-nav a:hover { text-decoration:underline }
  </style>
</head>
<body data-page="catalog">
  <div data-header></div>

  <div class="catalog-wrap">
    <div class="catalog-hero">
      <h1>📖 แคตตาล็อกสินค้า M.E.Tools</h1>
      <p>ดูสินค้าทั้งหมดแบบ Flipbook — ครบทุกรุ่น ทุกแบรนด์</p>
    </div>

    <div class="catalog-frame-wrap" id="catalogFrame">
      <div class="catalog-loading" id="catalogLoading">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        กำลังโหลดแคตตาล็อก…
      </div>
      <iframe
        id="catalogIframe"
        src="https://anyflip.com/qjteo/lhvk/"
        allowfullscreen
        allow="fullscreen"
        title="แคตตาล็อกสินค้า M.E.Tools"
        onload="document.getElementById('catalogLoading').style.display='none'"
      ></iframe>
    </div>

    <nav class="catalog-nav">
      <a href="shop.html">🛒 ดูสินค้าพร้อมราคา</a>
      <a href="index.html">🏠 หน้าแรก</a>
      <a href="https://anyflip.com/qjteo/lhvk/" target="_blank" rel="noopener">↗ เปิดเต็มหน้าจอ</a>
    </nav>
  </div>

  <div data-footer></div>

  <style>
    @keyframes spin { to { transform:rotate(360deg) } }
  </style>

  <script src="assets/thai-geo.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/public.js"></script>
</body>
</html>
