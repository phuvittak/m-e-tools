<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แคตตาล็อกสินค้า — M.E.Tools ท่ารั้ว เชียงใหม่</title>
  <meta name="description" content="ดูแคตตาล็อกเครื่องมือช่าง M.E.Tools ครบทุกรุ่น DEWALT MAKITA BOSCH ท่ารั้ว เชียงใหม่">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .catalog-wrap { display:flex; flex-direction:column; min-height:100vh }
    .catalog-hero {
      background:var(--ink,#0b0b0b); color:#fff; padding:28px 24px 20px;
      text-align:center
    }
    .catalog-hero h1 { margin:0 0 6px; font-size:clamp(20px,4vw,28px) }
    .catalog-hero p { margin:0; color:rgba(255,255,255,.65); font-size:14px }
    .catalog-body { flex:1; padding:28px 24px 40px }
    .catalog-brand { margin-bottom:34px }
    .catalog-brand-head {
      display:flex; align-items:baseline; gap:12px;
      border-bottom:3px solid var(--ink,#0b0b0b); padding-bottom:8px; margin-bottom:18px
    }
    .catalog-brand-head h2 {
      margin:0; font-size:clamp(18px,3vw,24px); font-family:var(--font-display,inherit);
      text-transform:uppercase; letter-spacing:.02em
    }
    .catalog-brand-count { color:var(--fg-2,#666); font-size:13px; font-weight:600 }
    .catalog-empty { text-align:center; padding:60px 20px; color:var(--fg-2,#666); font-size:15px }
    .catalog-nav {
      background:var(--ink,#0b0b0b); padding:12px 20px;
      display:flex; justify-content:center; gap:16px; flex-wrap:wrap
    }
    .catalog-nav a {
      color:var(--dw-yellow,#FFB81C); font-weight:600; font-size:14px;
      text-decoration:none
    }
    .catalog-nav a:hover { text-decoration:underline }
  </style>
</head>
<body data-page="catalog">
  <div data-header></div>

  <div class="catalog-wrap">
    <div class="catalog-hero">
      <h1>📖 แคตตาล็อกสินค้า M.E.Tools</h1>
      <p>เครื่องมือช่างครบทุกรุ่น ทุกแบรนด์ — อัปเดตอัตโนมัติจากสต็อกร้าน</p>
    </div>

    <main class="catalog-body wrap">
      <div data-catalog>
        <div class="catalog-empty">กำลังโหลดแคตตาล็อก…</div>
      </div>
    </main>

    <nav class="catalog-nav">
      <a href="shop.html">🛒 ดูสินค้าพร้อมราคา + ตัวกรอง</a>
      <a href="index.html">🏠 หน้าแรก</a>
    </nav>
  </div>

  <div data-footer></div>

  <script src="assets/thai-geo.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/public.js"></script>
</body>
</html>
