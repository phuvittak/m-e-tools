<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ — M.E.Tools</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="login">
  <div data-header></div>
  <main class="auth-wrap">
    <form class="auth-card" data-login>
      <h1>เข้าสู่ระบบ</h1>
      <p class="auth-sub">เข้าสู่ระบบเพื่อสั่งซื้อ/เช่า ติดตามคำสั่งซื้อ หรือเข้าสู่ระบบหลังร้าน (พนักงาน)</p>
      <div class="field"><label>อีเมล</label><input data-email type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>รหัสผ่าน</label><input data-pass type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="me-btn me-btn-block" type="submit">เข้าสู่ระบบ</button>
      <div class="auth-alt">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></div>
      <div class="auth-note">พนักงาน/เจ้าของร้าน เข้าสู่ระบบด้วยบัญชีที่ได้รับจากร้าน</div>
    </form>
  </main>
  <div data-footer></div>
  <script src="assets/thai-geo.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/public.js"></script>
</body>
</html>
