<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก — M.E.Tools</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="register">
  <div data-header></div>
  <main class="auth-wrap">
    <form class="auth-card" data-register>
      <h1>สมัครสมาชิก</h1>
      <p class="auth-sub">สมัครสมาชิกร้าน M.E.Tools เพื่อสั่งซื้อ/เช่าเครื่องมือและติดตามคำสั่งซื้อได้ง่ายขึ้น</p>
      <div class="field"><label>ชื่อ-นามสกุล</label><input data-name type="text" placeholder="เช่น สมชาย ใจดี"></div>
      <div class="field"><label>อีเมล</label><input data-email type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>เบอร์โทร</label><input data-phone type="tel" placeholder="08X-XXX-XXXX"></div>
      <div class="field"><label>รหัสผ่าน</label><input data-pass type="password" placeholder="••••••••" autocomplete="new-password"></div>
      <div class="field"><label>ยืนยันรหัสผ่าน</label><input data-pass2 type="password" placeholder="••••••••" autocomplete="new-password"></div>
      <button class="me-btn me-btn-block" type="submit">สมัครสมาชิก</button>
      <div class="auth-alt">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></div>
    </form>
  </main>
  <div data-footer></div>
  <script src="assets/thai-geo.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/public.js"></script>
</body>
</html>
