<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คลัง / สต็อก — M.E.Tools หลังร้าน</title>
  <link rel="stylesheet" href="../assets/admin.css?v=20260607s">
</head>
<body data-admin="inventory">
  <div class="admin" data-shell>
    <main class="main">
      <div class="topbar">
        <div><h1>คลัง / สต็อก</h1><div class="sub">จำนวนคงเหลือ ที่จัดเก็บ ต้นทุน และราคาของสินค้าทุกชิ้น</div></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn btn-ghost" data-sync-bot title="อัปโหลดสินค้าทั้งหมด (รวมรูป) ขึ้น cloud ให้หน้าร้านลูกค้าเห็น และอัปเดตข้อมูลให้บอท LINE — ปกติระบบซิงค์อัตโนมัติตอนบันทึกอยู่แล้ว ปุ่มนี้ใช้ดันสินค้าเดิมขึ้นครั้งแรกหรือดันซ้ำ">⤴ ซิงค์สินค้าขึ้นออนไลน์</button>
          <button class="btn" data-add>+ เพิ่มสินค้า</button>
        </div>
      </div>

      <div class="alert" data-alert style="display:none"></div>

      <div class="panel">
        <div class="search-admin">
          <input data-search type="text" placeholder="ค้นหาสินค้า / แบรนด์ / SKU / ที่จัดเก็บ…">
          <select data-catfilter></select>
          <label class="noloc-toggle" title="แสดงเฉพาะสินค้าที่ยังไม่ได้ระบุที่จัดเก็บ">
            <input type="checkbox" data-noloc> ยังไม่มีที่จัดเก็บ <span data-noloc-count></span>
          </label>
        </div>
        <div class="table-wrap"><table class="data" data-invtable></table></div>
      </div>
    </main>
  </div>
  <script src="../assets/thai-geo.js?v=20260607s"></script>
  <script src="../assets/store.js?v=20260607s"></script>
  <script src="../assets/ui.js?v=20260607s"></script>
  <script src="../assets/admin.js?v=20260607s"></script>
</body>
</html>
