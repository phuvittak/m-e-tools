<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คลัง / สต็อก — M.E.Tools หลังร้าน</title>
  <link rel="stylesheet" href="../assets/admin.css">
</head>
<body data-admin="inventory">
  <div class="admin" data-shell>
    <main class="main">
      <div class="topbar">
        <div><h1>คลัง / สต็อก</h1><div class="sub">จำนวนคงเหลือ ที่จัดเก็บ ต้นทุน และราคาของสินค้าทุกชิ้น</div></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn btn-ghost" data-sync-bot title="ส่งข้อมูลสินค้าทั้งหมดไป Firebase เพื่อให้บอท LINE ใช้ตอบลูกค้า">⤴ ซิงค์ไปบอท LINE</button>
          <button class="btn" data-add>+ เพิ่มสินค้า</button>
        </div>
      </div>

      <div class="alert" data-alert style="display:none"></div>

      <div class="panel">
        <div class="search-admin">
          <input data-search type="text" placeholder="ค้นหาสินค้า / แบรนด์ / SKU / ที่จัดเก็บ…">
          <select data-catfilter></select>
        </div>
        <div class="table-wrap"><table class="data" data-invtable></table></div>
      </div>
    </main>
  </div>
  <script src="../assets/thai-geo.js"></script>
  <script src="../assets/store.js"></script>
  <script src="../assets/ui.js"></script>
  <script src="../assets/admin.js"></script>
</body>
</html>
