<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คำสั่งซื้อ / เช่า — M.E.Tools หลังร้าน</title>
  <link rel="stylesheet" href="../assets/admin.css?v=20260621b">
</head>
<body data-admin="orders">
  <div class="admin" data-shell>
    <main class="main">
      <div class="topbar">
        <div><h1>คำสั่งซื้อ / เช่า</h1><div class="sub" data-osum></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost" data-export-orders title="ดาวน์โหลดคำสั่งซื้อทั้งหมดเป็นไฟล์ Excel (.xlsx) — แยกไฟล์ลูกค้า/ออเดอร์ ออกจากสต๊อก">📥 ดาวน์โหลดคำสั่งซื้อ (Excel)</button>
          <a class="btn btn-ghost" href="dashboard.html">← แดชบอร์ด</a>
        </div>
      </div>

      <div class="panel" data-testbar style="margin-bottom:14px;border-left:6px solid #f0a500">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:800;font-size:15px">
            <input type="checkbox" data-testmode style="width:18px;height:18px"> 🧪 โหมดทดลองสั่งซื้อ
          </label>
          <span class="sub" style="flex:1;min-width:200px">เปิดไว้ตอน "ลองสั่งซื้อ" — ออเดอร์ที่สั่งจะติดป้าย <b>ทดลอง</b> ไม่นับเป็นยอดขายจริง แล้วกดล้างทิ้งทีหลังได้ · เมื่อเปิดแล้วให้กด <b>"ดูหน้าร้านทดลอง"</b> เพื่อลองสั่งซื้อจริงๆ</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <a class="btn btn-ghost" href="../index.html" target="_blank" rel="noopener" data-preview-store style="background:#fffbeb;border-color:#f0a500;font-weight:700">🧪 ดูหน้าร้านทดลอง →</a>
          <button class="btn btn-sm btn-ghost" data-clear-test>ล้างออเดอร์ทดลองทั้งหมด</button>
          <button class="btn btn-sm btn-danger" data-clear-all>🗑️ ล้างออเดอร์ทั้งหมด</button>
        </div>
      </div>

      <div class="panel">
        <div class="search-admin">
          <input data-customer type="text" placeholder="ค้นหาลูกค้า: ชื่อ หรือ เบอร์โทร…">
          <select data-typefilter>
            <option value="">ทุกประเภท</option>
            <option value="buy">ซื้อสินค้า</option>
            <option value="rent">เช่าสินค้า</option>
          </select>
          <select data-statusfilter>
            <option value="">ทุกสถานะ</option>
            <option value="paid">ชำระแล้ว · รอรับสินค้า</option>
            <option value="received">ได้รับสินค้าแล้ว</option>
            <option value="returned">คืนแล้ว</option>
            <option value="cancelled">ยกเลิก</option>
          </select>
          <button class="btn btn-ghost" data-shipcfg>ตั้งค่าค่าจัดส่ง</button>
        </div>
        <div class="table-wrap"><table class="data" data-ordtable></table></div>
      </div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="../assets/thai-geo.js?v=20260621b"></script>
  <script src="../assets/store.js?v=20260621b"></script>
  <script src="../assets/bigseller-sync.js?v=20260621b"></script>
  <script src="../assets/ui.js?v=20260621b"></script>
  <script src="../assets/admin.js?v=20260621c"></script>
</body>
</html>
