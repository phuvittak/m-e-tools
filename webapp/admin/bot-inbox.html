<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แชทบอทลูกค้า — M.E.Tools หลังร้าน</title>
  <link rel="stylesheet" href="../assets/admin.css">
  <style>
    .botinbox-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px }
    .botinbox-kpi { background:var(--bg-1); border:1px solid var(--border-3); border-radius:10px; padding:14px 16px }
    .botinbox-kpi .lbl { font-size:12px; color:var(--fg-2); text-transform:uppercase; letter-spacing:.5px }
    .botinbox-kpi .val { font-size:28px; font-weight:700; color:var(--fg); margin-top:4px; font-family:var(--font-display, inherit) }
    .botinbox-kpi .sub { font-size:12px; color:var(--fg-2); margin-top:2px }

    .botinbox-split { display:grid; grid-template-columns:320px 1fr; gap:12px; min-height:560px }
    @media (max-width:900px) { .botinbox-split { grid-template-columns:1fr } }

    .conv-list { background:var(--bg-1); border:1px solid var(--border-3); border-radius:10px; overflow:auto; max-height:70vh }
    .conv-row { padding:12px 14px; border-bottom:1px solid var(--border-3); cursor:pointer; transition:background .15s }
    .conv-row:hover { background:var(--bg-2) }
    .conv-row.on { background:var(--bg-2); border-left:3px solid var(--accent) }
    .conv-row .who { font-weight:600; font-size:13px; color:var(--fg); display:flex; justify-content:space-between }
    .conv-row .last { font-size:12px; color:var(--fg-2); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .conv-row .meta { font-size:11px; color:var(--fg-2); margin-top:4px; display:flex; gap:8px }

    .thread { background:var(--bg-1); border:1px solid var(--border-3); border-radius:10px; padding:16px; overflow:auto; max-height:70vh }
    .thread-empty { color:var(--fg-2); text-align:center; padding:40px 20px; font-family:var(--font-body) }
    .msg-pair { margin-bottom:18px; padding-bottom:14px; border-bottom:1px dashed var(--border-3) }
    .msg-pair:last-child { border-bottom:none }
    .msg-line { display:flex; gap:10px; margin-bottom:8px; align-items:flex-start }
    .msg-line .role { font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px; flex-shrink:0; min-width:60px; text-align:center }
    .msg-line.user .role { background:#e3f2fd; color:#0d47a1 }
    .msg-line.bot .role { background:#e8f5e9; color:#1b5e20 }
    .msg-line .body { flex:1; font-size:14px; color:var(--fg); white-space:pre-wrap; font-family:var(--font-body); line-height:1.5 }
    .msg-time { font-size:11px; color:var(--fg-2); margin-top:4px; padding-left:70px }

    .botinbox-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center }
    .botinbox-toolbar .grow { flex:1 }
    .keyword-cloud { display:flex; flex-wrap:wrap; gap:6px }
    .keyword-pill { background:var(--bg-2); border:1px solid var(--border-3); border-radius:12px; padding:4px 10px; font-size:12px; color:var(--fg-2) }
    .keyword-pill b { color:var(--fg); margin-right:4px }
  </style>
</head>
<body data-admin="botinbox">
  <div class="admin" data-shell>
    <main class="main">
      <div class="topbar">
        <div><h1>แชทบอทลูกค้า</h1><div class="sub">บันทึกข้อความที่ลูกค้าทักบอท LINE + คำตอบที่บอทตอบ</div></div>
        <button class="btn btn-ghost" data-refresh>↻ รีเฟรช</button>
      </div>

      <div class="alert" data-alert style="display:none"></div>

      <div class="botinbox-kpis">
        <div class="botinbox-kpi"><div class="lbl">วันนี้</div><div class="val" data-kpi-today>—</div><div class="sub">ข้อความที่ลูกค้าทักมา</div></div>
        <div class="botinbox-kpi"><div class="lbl">ลูกค้าวันนี้</div><div class="val" data-kpi-users>—</div><div class="sub">คนที่ทักวันนี้</div></div>
        <div class="botinbox-kpi"><div class="lbl">7 วันย้อนหลัง</div><div class="val" data-kpi-week>—</div><div class="sub">ข้อความรวม</div></div>
        <div class="botinbox-kpi"><div class="lbl">ลูกค้าทั้งหมด</div><div class="val" data-kpi-total>—</div><div class="sub">คนที่เคยทักมา</div></div>
      </div>

      <div class="panel" style="margin-bottom:12px">
        <div style="font-weight:600; font-size:13px; margin-bottom:8px; color:var(--fg)">คำที่ถามบ่อย (7 วัน)</div>
        <div class="keyword-cloud" data-keywords>—</div>
      </div>

      <div class="botinbox-split">
        <div class="conv-list" data-convs>
          <div class="thread-empty">กำลังโหลด…</div>
        </div>
        <div class="thread" data-thread>
          <div class="thread-empty">เลือกบทสนทนาทางซ้ายเพื่อดูข้อความ</div>
        </div>
      </div>
    </main>
  </div>
  <script src="../assets/thai-geo.js"></script>
  <script src="../assets/store.js"></script>
  <script src="../assets/ui.js"></script>
  <script src="../assets/admin.js"></script>
</body>
</html>
