<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ด — M.E.Tools หลังร้าน</title>
  <link rel="stylesheet" href="../assets/admin.css?v=20260621e">
  <style>
    .low-search { width:100%; padding:8px 12px; border:1px solid var(--border-3); border-radius:8px; margin-bottom:10px; font-family:var(--font-body); font-size:14px; outline:none; background:#fff }
    .low-search:focus { border-color:var(--accent,#FFB81C) }
    .low-group { border-bottom:1px solid var(--border-3) }
    .low-ghead { cursor:pointer; padding:10px 4px; font-weight:700; font-family:var(--font-body); font-size:14px; user-select:none; display:flex; align-items:center; gap:4px }
    .low-ghead:hover { background:var(--bg-2) }
    .low-gn { color:var(--fg-2); font-weight:400; font-size:12px }
    .low-item { border-top:1px dashed var(--border-3) }
    .low-irow { display:flex; justify-content:space-between; gap:8px; padding:9px 8px; cursor:pointer; font-family:var(--font-body); font-size:14px }
    .low-irow:hover { background:var(--bg-2) }
    .low-form { padding:10px 8px 14px; background:var(--bg-2); display:flex; flex-direction:column; gap:8px }
    .low-frow { display:flex; align-items:center; gap:8px }
    .low-frow label { width:80px; font-size:13px; color:var(--fg-2); font-family:var(--font-body) }
    .low-frow input { flex:1; padding:7px 10px; border:1px solid var(--border-3); border-radius:6px; font-family:var(--font-body); font-size:14px; outline:none; background:#fff }
    .low-form .btn { align-self:flex-end }
  </style>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-admin="dashboard">
  <div class="admin" data-shell>
    <main class="main">
      <div class="topbar">
        <div><h1>แดชบอร์ด</h1><div class="sub">ภาพรวมรายได้ ต้นทุน กำไร และสต็อกสินค้า</div></div>
        <a class="btn btn-ghost" href="orders.html">ดูคำสั่งซื้อทั้งหมด →</a>
      </div>

      <div class="kpis" data-kpis></div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h2>รายได้ 7 วันล่าสุด</h2></div>
          <div class="chart" data-chart></div>
          <div class="legend"><span><span class="swatch y"></span> รายได้</span><span><span class="swatch g"></span> กำไร</span></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>สินค้าใกล้หมด</h2></div>
          <div data-lowstock></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>คำสั่งซื้อล่าสุด</h2><a class="btn btn-sm btn-ghost" href="orders.html">ทั้งหมด</a></div>
        <div class="table-wrap"><table class="data" data-recent></table></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>ขายดี &amp; คะแนนรีวิว</h2><span class="sub">เรียงตามยอดขาย — ดูว่าตัวไหนขายดี/คะแนนดี</span></div>
        <div class="table-wrap"><table class="data" data-bestsellers></table></div>
      </div>
    </main>
  </div>
  <script src="../assets/thai-geo.js?v=20260621b"></script>
  <script src="../assets/store.js?v=20260621b"></script>
  <script src="../assets/bigseller-sync.js?v=20260621b"></script>
  <script src="../assets/ui.js?v=20260621b"></script>
  <script src="../assets/admin.js?v=20260621e"></script>
</body>
</html>
