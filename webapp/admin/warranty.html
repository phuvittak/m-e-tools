<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนประกัน — M.E.Tools หลังร้าน</title>
  <link rel="stylesheet" href="../assets/admin.css?v=20260614d">
  <style>
    .wl-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px }
    .wl-tabs { display:flex; gap:6px; flex-wrap:wrap }
    .wl-tab { background:#fff; border:2px solid var(--ink); border-radius:20px; padding:6px 14px; font-weight:700; font-size:13px; cursor:pointer }
    .wl-tab.on { background:var(--dw-yellow); }
    .wl-search { flex:1; min-width:200px }
    .wl-search input { width:100%; padding:10px 14px; border:2px solid var(--border-3,#ddd); border-radius:8px; font-family:var(--font-body); font-size:14px; outline:none; background:#fff }
    .wl-count { font-size:13px; color:var(--fg-2); margin-bottom:10px }
    .wl-list { display:flex; flex-direction:column; gap:10px }
    .wl-item { display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--border-3,#e6e6e6); border-radius:10px; padding:12px 14px }
    .wl-item-main { flex:1; min-width:0 }
    .wl-item-name { font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap }
    .wl-item-sub { font-size:13px; color:var(--fg-2); margin-top:2px }
    .wl-badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:12px; white-space:nowrap }
    .wl-badge.cust { background:#e6f4ea; color:#1a7f37 }
    .wl-badge.staff { background:#fff3d6; color:#9a6b00 }
    .wl-empty { padding:30px; text-align:center; color:var(--fg-2); font-size:14px }
    /* modal */
    .wl-modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; z-index:1000; overflow:auto }
    .wl-modal-card { background:#fff; border:3px solid var(--ink); border-radius:10px; max-width:560px; width:100%; padding:20px; position:relative }
    .wl-modal-card h2 { margin:0 0 14px; font-family:var(--font-display-th,inherit); font-style:italic; font-weight:900; text-transform:uppercase; font-size:20px }
    .wl-modal-x { position:absolute; top:10px; right:12px; background:none; border:none; font-size:28px; line-height:1; cursor:pointer; color:#888 }
    .wl-detail { width:100%; border-collapse:collapse; font-size:14px }
    .wl-detail th { text-align:left; color:var(--fg-3); font-weight:600; padding:7px 10px 7px 0; vertical-align:top; white-space:nowrap; width:38% }
    .wl-detail td { padding:7px 0; border-bottom:1px solid #eee; font-weight:600 }
    .wl-docs { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px }
    .wl-doc-label { font-size:12px; color:var(--fg-3); margin-bottom:4px }
    .wl-doc { max-width:200px; max-height:240px; border-radius:8px; border:1px solid #ddd; display:block }
  </style>
</head>
<body data-admin="warranty">
  <div class="admin" data-shell>
    <main class="main">
      <div class="topbar">
        <div><h1>ลงทะเบียนประกัน</h1><div class="sub">ใบลงทะเบียนรับประกันสินค้าจากลูกค้า/พนักงาน — ค้นหาด้วยชื่อ เบอร์ หรือรหัสสินค้า</div></div>
        <a class="btn btn-ghost" href="../warranty.html" target="_blank" rel="noopener">+ เปิดฟอร์มลงทะเบียน</a>
      </div>

      <div data-warranty-root>
        <div class="wl-bar">
          <div class="wl-tabs">
            <button class="wl-tab on" data-wl-tab="all">ทั้งหมด</button>
            <button class="wl-tab" data-wl-tab="customer">ลูกค้าลงเอง</button>
            <button class="wl-tab" data-wl-tab="staff">พนักงานลงให้</button>
          </div>
          <div class="wl-search"><input data-wl-search type="search" placeholder="🔎 ค้นหา ชื่อ / เบอร์โทร / รหัสสินค้า (SN) / รุ่น"></div>
        </div>
        <div class="wl-count" data-wl-count></div>
        <div class="wl-list" data-wl-list><div class="wl-empty">กำลังโหลด…</div></div>
      </div>
    </main>
  </div>
  <script src="../assets/thai-geo.js?v=20260614d"></script>
  <script src="../assets/store.js?v=20260614d"></script>
  <script src="../assets/ui.js?v=20260614d"></script>
  <script src="../assets/admin.js?v=20260614d"></script>
</body>
</html>
