<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจสอบสถานะลงทะเบียนประกัน — M.E.Tools</title>
  <link rel="stylesheet" href="assets/app.css?v=20260607y">
  <style>
    .ws-wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
    .ws-head { background: var(--ink,#111); color:#fff; border-radius: 12px; padding: 18px 18px; margin-bottom: 18px; }
    .ws-head h1 { margin: 0; font-family: var(--font-display-th,inherit); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: clamp(20px,4vw,28px); }
    .ws-head p { margin: 4px 0 0; color: rgba(255,255,255,.7); font-size: 13px; }
    .ws-card { background:#fff; border:3px solid var(--ink,#111); box-shadow:6px 6px 0 0 var(--ink,#111); padding:18px; margin-bottom:18px; }
    .ws-row { display:flex; gap:8px; }
    .ws-row input { flex:1; padding:11px 12px; border:2px solid #d8d8d8; border-radius:8px; font-size:15px; }
    .ws-mine-title { font-weight:800; font-size:14px; margin:0 0 8px; }
    .ws-mine-item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border:1px solid #e6e6e6; border-radius:8px; margin-bottom:8px; cursor:pointer }
    .ws-mine-item:hover { border-color: var(--dw-yellow-deep,#b8860b); background:#fffdf5 }
    .ws-mine-item .nm { font-weight:700; font-size:14px }
    .ws-mine-item .ref { font-family: var(--font-mono,monospace); font-size:12px; color:#888 }
    .ws-empty { color:#999; font-size:13px }
    .ws-result { margin-top:4px }
    .ws-status-badge { display:inline-block; padding:5px 12px; border-radius:20px; font-weight:800; font-size:14px; }
    .ws-status-badge.pending { background:#fff3d6; color:#9a6b00 }
    .ws-status-badge.approved { background:#e6f4ea; color:#1a7f37 }
    .ws-status-badge.rejected { background:#fde8e8; color:#c0392b }
    .ws-detail { width:100%; border-collapse:collapse; font-size:14px; margin-top:12px }
    .ws-detail th { text-align:left; color:#888; font-weight:600; padding:7px 10px 7px 0; vertical-align:top; white-space:nowrap; width:42% }
    .ws-detail td { padding:7px 0; border-bottom:1px solid #eee; font-weight:600 }
    .ws-big { text-align:center; font-size:42px }
  </style>
</head>
<body data-page="warranty-status">
  <div data-header></div>

  <main class="ws-wrap">
    <div class="ws-head">
      <h1>ตรวจสอบสถานะลงทะเบียนประกัน</h1>
      <p>กรอก <b>เลขอ้างอิง</b> (WR-XXXX-…) หรือ <b>รหัสสินค้า / รุ่น / ชื่อ</b> เพื่อค้นหาใบประกัน</p>
    </div>

    <div class="ws-card">
      <div class="ws-row">
        <input data-ws-input type="text" placeholder="เลขอ้างอิง WR-… หรือ รหัสสินค้า / รุ่น">
        <button class="me-btn" type="button" data-ws-go>ค้นหา</button>
      </div>
      <p class="ws-empty" style="margin:8px 0 0">ค้นด้วยรหัสสินค้า/รุ่น/ชื่อ ได้สำหรับใบที่ลงจากเครื่องนี้ · จากเครื่องอื่นให้ใช้เลขอ้างอิง</p>
      <div class="ws-result" data-ws-result></div>
    </div>

    <div class="ws-card" data-ws-mine-box>
      <div class="ws-mine-title">📋 ใบประกันที่ลงจากอุปกรณ์นี้</div>
      <div data-ws-mine><div class="ws-empty">ยังไม่มีรายการในเครื่องนี้</div></div>
    </div>

    <a class="me-btn me-btn-block" href="warranty.html">+ ลงทะเบียนประกันใหม่</a>
  </main>

  <div data-footer></div>
  <script src="assets/thai-geo.js?v=20260607y"></script>
  <script src="assets/store.js?v=20260607y"></script>
  <script src="assets/ui.js?v=20260607y"></script>
  <script src="assets/public.js?v=20260607y"></script>
</body>
</html>
