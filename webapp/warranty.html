<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนประกันสินค้า — M.E.Tools</title>
  <meta name="description" content="ลงทะเบียนรับประกันสินค้า DEWALT / Stanley Black &amp; Decker กับ M.E.Tools ท่ารั้ว เชียงใหม่">
  <link rel="stylesheet" href="assets/app.css?v=20260606w">
  <style>
    .wr-wrap { max-width: 720px; margin: 0 auto; padding: 22px 16px 60px; }
    .wr-head { background: var(--dw-yellow,#FFB81C); border: 3px solid var(--ink,#111); box-shadow: 6px 6px 0 0 var(--ink,#111); padding: 16px 18px; margin-bottom: 18px; }
    .wr-head h1 { margin: 0; font-family: var(--font-display-th,inherit); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: clamp(22px,4vw,30px); }
    .wr-head p { margin: 4px 0 0; font-size: 14px; }
    .wr-card { background: #fff; border: 3px solid var(--ink,#111); box-shadow: 6px 6px 0 0 var(--ink,#111); padding: 18px; margin-bottom: 18px; }
    .wr-card h2 { margin: 0 0 14px; font-family: var(--font-display-th,inherit); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: 19px; }
    .wr-field { margin-bottom: 13px; }
    .wr-field label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 5px; }
    .wr-field .req { color: var(--price-red,#e11); }
    .wr-field input, .wr-field select, .wr-field textarea { width: 100%; padding: 11px 12px; border: 2px solid #d8d8d8; border-radius: 8px; font-family: inherit; font-size: 15px; background: #fff; }
    .wr-field input:focus, .wr-field select:focus, .wr-field textarea:focus { border-color: var(--dw-yellow-deep,#b8860b); outline: none; }
    .wr-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .wr-row > .wr-field { flex: 1; min-width: 150px; }
    .wr-hint { font-size: 12px; color: #888; margin: -2px 0 0; }
    .wr-file { display: block; }
    .wr-file-prev { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .wr-file-prev img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .wr-status { margin-top: 12px; font-weight: 700; }
    .wr-done { text-align: center; padding: 30px 16px; }
    .wr-done .big { font-size: 46px; }
    .wr-check { float: right; }
  </style>
</head>
<body data-page="warranty">
  <div data-header></div>

  <main class="wr-wrap">
    <div class="wr-head">
      <a class="me-btn me-btn-sm wr-check" href="warranty-status.html">ตรวจสอบสถานะ / Check Status</a>
      <h1>ลงทะเบียนประกันสินค้า</h1>
      <p>SBD Product Registration · DEWALT / Stanley Black &amp; Decker</p>
    </div>

    <form data-warranty-form>
      <div class="wr-card">
        <h2>ข้อมูลลูกค้า / Customer information</h2>
        <div class="wr-row">
          <div class="wr-field"><label>ชื่อ / First name <span class="req">*</span></label><input data-w="firstName" required></div>
          <div class="wr-field"><label>นามสกุล / Last name <span class="req">*</span></label><input data-w="lastName" required></div>
        </div>
        <div class="wr-field"><label>เบอร์โทร / Mobile number <span class="req">*</span></label><input data-w="phone" type="tel" inputmode="tel" required></div>
        <div class="wr-field"><label>ผู้ลงทะเบียน / Registrant <span class="req">*</span></label>
          <select data-w="registrant" required>
            <option value="customer">ลูกค้า / Customer</option>
            <option value="staff">พนักงานขาย / Saler</option>
          </select>
        </div>
        <div class="wr-field"><label>ที่อยู่ / Address <span class="req">*</span></label><input data-w="address" required></div>
        <div class="wr-row">
          <div class="wr-field"><label>จังหวัด / Province <span class="req">*</span></label><select data-w="province" data-province required><option value="">เลือกจังหวัด</option></select></div>
          <div class="wr-field"><label>รหัสไปรษณีย์ / Postcode <span class="req">*</span></label><input data-w="postcode" inputmode="numeric" required></div>
        </div>
        <div class="wr-row">
          <div class="wr-field"><label>อีเมล / Email</label><input data-w="email" type="email"></div>
          <div class="wr-field"><label>ไลน์ ไอดี / LINE ID</label><input data-w="lineId"></div>
        </div>
      </div>

      <div class="wr-card">
        <h2>ข้อมูลสินค้าที่ซื้อ / Product information</h2>
        <div class="wr-row">
          <div class="wr-field"><label>วันที่ซื้อสินค้า / Purchase date <span class="req">*</span></label><input data-w="purchaseDate" type="date" required></div>
          <div class="wr-field"><label>สัปดาห์ที่ผลิต / Date code (XXXX-XX)</label><input data-w="dateCode" placeholder="เช่น 2024-15"></div>
        </div>
        <div class="wr-row">
          <div class="wr-field"><label>ร้านค้าที่ซื้อ / Retailer <span class="req">*</span></label><input data-w="retailer" value="M.E.Tools" required></div>
          <div class="wr-field"><label>สาขา / Branch <span class="req">*</span></label><input data-w="branch" value="ท่ารั้ว เชียงใหม่" required></div>
        </div>
        <div class="wr-row">
          <div class="wr-field"><label>ยี่ห้อสินค้า / Brand <span class="req">*</span></label><input data-w="brand" placeholder="เช่น DEWALT" required></div>
          <div class="wr-field"><label>ประเภทสินค้า / Category <span class="req">*</span></label><input data-w="category" placeholder="เช่น สว่านไร้สาย" required></div>
        </div>
        <div class="wr-row">
          <div class="wr-field"><label>รุ่น / Model <span class="req">*</span></label><input data-w="model" placeholder="เช่น DCD701" required></div>
          <div class="wr-field"><label>รหัสสินค้า / Serial number</label><input data-w="serial"></div>
        </div>
        <div class="wr-field"><label>แนบใบเสร็จ/ใบรับประกัน (JPG, PNG) <span class="req">*</span></label>
          <input class="wr-file" type="file" accept="image/*" data-w-file="receipt" required>
          <div class="wr-file-prev" data-prev="receipt"></div>
        </div>
        <div class="wr-field"><label>เอกสารอื่น / Other document (ไม่บังคับ)</label>
          <input class="wr-file" type="file" accept="image/*" data-w-file="otherDoc">
          <div class="wr-file-prev" data-prev="otherDoc"></div>
        </div>
        <div class="wr-field"><label>ข้อเสนอแนะเพิ่มเติม / Comment</label><textarea data-w="comment" rows="2"></textarea></div>
      </div>

      <button class="me-btn me-btn-block" type="submit">ลงทะเบียน / Submit</button>
      <div class="wr-status" data-wr-status></div>
    </form>
  </main>

  <div data-footer></div>
  <script src="assets/thai-geo.js?v=20260606w"></script>
  <script src="assets/store.js?v=20260606w"></script>
  <script src="assets/ui.js?v=20260606w"></script>
  <script src="assets/public.js?v=20260606w"></script>
</body>
</html>
